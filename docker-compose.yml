version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - MONGODB_URI=mongodb+srv://QuillAdmin:Chibuike4u%40QuillAdmin@clusterquill.qhfb9fo.mongodb.net/quill_cms?retryWrites=true&w=majority&appName=ClusterQuill
      - REDIS_URL=redis://redis:6379
