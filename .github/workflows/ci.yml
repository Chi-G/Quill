name: Quill Engine CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        run: npx -p typescript tsc --noEmit

      - name: Run Integration Tests
        env:
          MONGODB_URI: mongodb+srv://QuillAdmin:Chibuike4u%40QuillAdmin@clusterquill.qhfb9fo.mongodb.net/quill_cms_test?retryWrites=true&w=majority&appName=ClusterQuill
        run: npm test

      - name: Build Production Bundle
        run: npm run build
